name: Backend
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
